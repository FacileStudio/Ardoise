name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        working-directory: packages/database
        run: bun run db:generate

      - name: Typecheck
        run: bunx turbo run typecheck

      - name: Lint
        run: bunx turbo run lint

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ardoise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ardoise_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ardoise_test
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        working-directory: packages/database
        run: bun run db:generate

      - name: Apply the migrations
        working-directory: packages/database
        run: bun run db:migrate:deploy

      - name: Test
        run: |
          set -euo pipefail
          for dir in packages/trpc apps/backend packages/admin packages/glouton packages/nuage packages/plume packages/storage packages/typst; do
            echo "::group::$dir"
            (cd "$dir" && bun test)
            echo "::endgroup::"
          done
