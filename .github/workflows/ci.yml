name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ardoise
          POSTGRES_PASSWORD: ardoise
          POSTGRES_DB: ardoise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ardoise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ardoise:ardoise@localhost:5432/ardoise
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --filter @repo/database db:generate

      - name: Push schema to DB
        run: bun run --filter @repo/database db:push

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        env:
          VITE_API_URL: http://localhost:3001
        run: bun run build
