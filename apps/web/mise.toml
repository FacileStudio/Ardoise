[env]
_.file = ".env"

[tasks.dev]
description = "Start the web dev server"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run dev'

[tasks.build]
description = "Build the web app"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run build'

[tasks.preview]
description = "Preview the web build"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run preview'

[tasks.check]
description = "Run the web Svelte checks"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run check'

[tasks.typecheck]
description = "Typecheck the web app"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run typecheck'

[tasks.lint]
description = "Lint the web app"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run lint'
