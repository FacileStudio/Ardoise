<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="color-scheme" content="light dark" />

    <meta name="robots" content="noindex, nofollow" />

    <script>
      try {
        var t = localStorage.getItem('ardoise.theme');
        var r = document.documentElement.classList;
        r.toggle('dark', t === 'dark');
        r.toggle('light', t === 'light');
      } catch (e) {}
    </script>
    <script>
      (function () {
        if (location.hostname !== 'ardoise.facile.studio') return;
        if (location.pathname.indexOf('/pay/') === 0) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://vision.facile.studio/s.js';
        s.setAttribute('data-mask', '');
        document.head.appendChild(s);
      })();
    </script>

    %sveltekit.head%
    <title>Ardoise · Invoice, get paid, move on</title>
    <meta name="description" content="Quotes that become invoices in one click, Stripe payments, automatic reminders and PDF receipts." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Facile" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://ardoise.facile.studio/" />
    <meta property="og:title" content="Ardoise · Invoice, get paid, move on" />
    <meta property="og:description" content="Quotes that become invoices in one click, Stripe payments, automatic reminders and PDF receipts." />
    <meta property="og:image" content="https://ardoise.facile.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ardoise: Invoice, get paid, move on" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ardoise · Invoice, get paid, move on" />
    <meta name="twitter:description" content="Quotes that become invoices in one click, Stripe payments, automatic reminders and PDF receipts." />
    <meta name="twitter:image" content="https://ardoise.facile.studio/og-image.png" />
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
