[build]
builder = "dockerfile"
dockerfilePath = "apps/frontend/Dockerfile"

[build.env]
TURBO_TOKEN = "$TURBO_TOKEN"
TURBO_TEAM = "$TURBO_TEAM"

[deploy]
startCommand = "bun run apps/frontend/build"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
