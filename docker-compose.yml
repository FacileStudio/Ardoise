services:
  postgres:
    image: postgres:16-alpine
    container_name: ardoise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ardoise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ardoise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      network: host
    container_name: ardoise-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ardoise}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKOFFICE_URL: ${BACKOFFICE_URL:-http://localhost:3002}
      STORAGE_PATH: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      network: host
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    container_name: ardoise-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  backoffice:
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
      network: host
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    container_name: ardoise-backoffice
    environment:
      NODE_ENV: production
      PORT: 3002
      BACKOFFICE_URL: ${BACKOFFICE_URL:-http://localhost:3002}
      VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    expose:
      - "3002"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
