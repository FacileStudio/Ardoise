services:
  ardoise-postgres:
    image: postgres:16-alpine
    container_name: ardoise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ardoise}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  ardoise-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ardoise-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@ardoise-postgres:5432/${POSTGRES_DB:-ardoise}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_PATH: /data/uploads
    volumes:
    - uploads_data:/data/uploads
    expose:
    - '3001'
    depends_on:
      ardoise-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3001'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  ardoise-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    container_name: ardoise-web
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    expose:
    - '3000'
    depends_on:
    - ardoise-backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  postgres_data: null
  uploads_data: null
