services:
  ardoise-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ardoise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ardoise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ardoise-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        VERSION: ${APP_VERSION:-}
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@ardoise-postgres:5432/${POSTGRES_DB:-ardoise}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_PATH: /data/uploads
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "3001"
    depends_on:
      ardoise-postgres:
        condition: service_healthy
    restart: unless-stopped

  ardoise-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    expose:
      - "3000"
    depends_on:
      - ardoise-backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
